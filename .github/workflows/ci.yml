name: CI & Selective Monorepo Verification

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  selective-verification:
    name: Selective Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Affected Lint, Test & Build (Pull Requests)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sentinel_test?sslmode=disable
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sentinel_test?sslmode=disable
        run: |
          echo "Running selective validation against base branch origin/${{ github.base_ref }}..."
          pnpm turbo run lint test build --filter="...[origin/${{ github.base_ref }}]"

      - name: Run Full Lint, Test & Build (Push to Main/Master)
        if: github.event_name == 'push'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sentinel_test?sslmode=disable
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sentinel_test?sslmode=disable
        run: |
          echo "Running monorepo validation on direct push..."
          pnpm turbo run lint test build
