name: Context Factory Bridge Health

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bridge-and-doctor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Verify Context Factory Bridge
        run: pnpm context:bridge

      - name: Verify Context Factory Health & Lockfile
        run: pnpm context:doctor
